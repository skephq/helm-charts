# Skep Collector (0.1.0), agent profile: the configuration the
# skep-collector Helm chart runs for these values. Generated by Skep; do not edit by hand.
#
# The chart sets the environment from its values:
#   SKEP_ENDPOINT, SKEP_ENVIRONMENT, SKEP_COLLECTOR_NAME, SKEP_FLEET,
#   SKEP_TIER, SKEP_GATEWAY_ENDPOINT; secrets from the existing Secret:
#   SKEP_API_KEY
#
# Pipeline: OTLP in (and host metrics, system logs) -> memory_limiter -> skepobserver/pre -> otlp_grpc/gateway.
# The observers are read only: they never drop, change or delay telemetry.
# Batching happens in the exporter's sending queue, persisted under
# /var/lib/skep-otelcol/queue; there is no batch processor.
# Edge tier: this collector counts what exists (pre_sampling) and marks what it
# forwards (x-skep-observed) so the gateway does not count it again.

extensions:
  skepcontrol:
    endpoint: ${env:SKEP_ENDPOINT}
    api_key: ${env:SKEP_API_KEY}
    environment: ${env:SKEP_ENVIRONMENT}
    name: ${env:SKEP_COLLECTOR_NAME:-}
    fleet: ${env:SKEP_FLEET}
    tier: ${env:SKEP_TIER}
    state_dir: /var/lib/skep-otelcol
  health_check:
    endpoint: 0.0.0.0:13133
  # Exporter sending queues persist here, so a restart does not lose
  # queued telemetry.
  file_storage/queue:
    directory: /var/lib/skep-otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Request metadata lets the observer see which tier already counted
        # an item (x-skep-observed).
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
  host_metrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      filesystem: {}
      network: {}
  file_log/system:
    include:
      - /hostfs/var/log/syslog
      - /hostfs/var/log/messages
      - /hostfs/var/log/auth.log
      - /hostfs/var/log/secure
    start_at: end

processors:
  # First in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource_detection:
    detectors: [env, system]
    override: false
  k8s_attributes:
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection
  skepobserver/pre:
    position: pre_sampling
    control_extension: skepcontrol

exporters:
  # The gateway tier. The header tells its observers this data was already
  # counted here, so it is not counted twice.
  otlp_grpc/gateway:
    endpoint: ${env:SKEP_GATEWAY_ENDPOINT}
    tls:
      insecure: true
    headers:
      x-skep-observed: pre_sampling
    # Batches form here (no batch processor): flushed every 1s, at most
    # 3500000 bytes per request. The queue is bounded in bytes, sized to
    # the memory limit, and persisted with file_storage/queue.
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 104857600
      batch:
        flush_timeout: 1s
        min_size: 1000000
        max_size: 3500000

service:
  extensions: [health_check, skepcontrol, file_storage/queue]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, k8s_attributes, skepobserver/pre]
      exporters: [otlp_grpc/gateway]
    metrics:
      receivers: [otlp, host_metrics]
      processors: [memory_limiter, resource_detection, k8s_attributes, skepobserver/pre]
      exporters: [otlp_grpc/gateway]
    logs:
      receivers: [otlp, file_log/system]
      processors: [memory_limiter, resource_detection, k8s_attributes, skepobserver/pre]
      exporters: [otlp_grpc/gateway]
