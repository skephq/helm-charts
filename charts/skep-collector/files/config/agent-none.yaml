# Skep Collector (0.1.0), agent profile: the configuration the
# skep-collector Helm chart runs for these values. Generated by Skep; do not edit by hand.
#
# The chart sets the environment from its values:
#   SKEP_ENDPOINT, SKEP_ENVIRONMENT, SKEP_COLLECTOR_NAME, SKEP_FLEET,
#   SKEP_TIER; secrets from the existing Secret:
#   SKEP_API_KEY
#
# Pipeline: OTLP in (and host metrics) -> memory_limiter -> skepobserver/pre -> nop.
# The observers are read only: they never drop, change or delay telemetry.

extensions:
  skepcontrol:
    endpoint: ${env:SKEP_ENDPOINT}
    api_key: ${env:SKEP_API_KEY}
    environment: ${env:SKEP_ENVIRONMENT}
    name: ${env:SKEP_COLLECTOR_NAME:-}
    fleet: ${env:SKEP_FLEET}
    tier: ${env:SKEP_TIER}
    state_dir: /var/lib/skep-otelcol
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Request metadata lets the observer see which tier already counted
        # an item (x-skep-observed).
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
  host_metrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      filesystem: {}
      network: {}

processors:
  # First in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource_detection:
    detectors: [env, system]
    override: false
  k8s_attributes:
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection
  skepobserver/pre:
    position: pre_sampling
    control_extension: skepcontrol

exporters:
  # No backend yet: telemetry is observed by Skep, then discarded.
  nop: {}

service:
  extensions: [health_check, skepcontrol]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, k8s_attributes, skepobserver/pre]
      exporters: [nop]
    metrics:
      receivers: [otlp, host_metrics]
      processors: [memory_limiter, resource_detection, k8s_attributes, skepobserver/pre]
      exporters: [nop]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, k8s_attributes, skepobserver/pre]
      exporters: [nop]
