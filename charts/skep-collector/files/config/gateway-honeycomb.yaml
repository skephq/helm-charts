# Skep Collector (0.1.0), gateway profile: the configuration the
# skep-collector Helm chart runs for these values. Generated by Skep; do not edit by hand.
#
# The chart sets the environment from its values:
#   SKEP_ENDPOINT, SKEP_ENVIRONMENT, SKEP_COLLECTOR_NAME, SKEP_FLEET,
#   SKEP_TIER; secrets from the existing Secret:
#   SKEP_API_KEY, HONEYCOMB_API_KEY
#
# Pipeline: OTLP in -> memory_limiter -> skepobserver/pre -> otlp_grpc/honeycomb.
# The observers are read only: they never drop, change or delay telemetry.
# Batching happens in the exporter's sending queue, persisted under
# /var/lib/skep-otelcol/queue; there is no batch processor.

extensions:
  skepcontrol:
    endpoint: ${env:SKEP_ENDPOINT}
    api_key: ${env:SKEP_API_KEY}
    environment: ${env:SKEP_ENVIRONMENT}
    name: ${env:SKEP_COLLECTOR_NAME:-}
    fleet: ${env:SKEP_FLEET}
    tier: ${env:SKEP_TIER}
    state_dir: /var/lib/skep-otelcol
  health_check:
    endpoint: 0.0.0.0:13133
  # Exporter sending queues persist here, so a restart does not lose
  # queued telemetry.
  file_storage/queue:
    directory: /var/lib/skep-otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Request metadata lets the observer see which tier already counted
        # an item (x-skep-observed).
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  # First in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  skepobserver/pre:
    position: pre_sampling
    control_extension: skepcontrol

exporters:
  # No x-honeycomb-dataset header: logs land in datasets by service.name,
  # and metrics ignore it.
  otlp_grpc/honeycomb:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
    # Batches form here (no batch processor): flushed every 1s, at most
    # 3500000 bytes per request. The queue is bounded in bytes, sized to
    # the memory limit, and persisted with file_storage/queue.
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 104857600
      batch:
        flush_timeout: 1s
        min_size: 1000000
        max_size: 3500000

service:
  extensions: [health_check, skepcontrol, file_storage/queue]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, skepobserver/pre]
      exporters: [otlp_grpc/honeycomb]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, skepobserver/pre]
      exporters: [otlp_grpc/honeycomb]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, skepobserver/pre]
      exporters: [otlp_grpc/honeycomb]
