# Skep Collector (0.1.0), gateway profile: the configuration the
# skep-collector Helm chart runs for these values. Generated by Skep; do not edit by hand.
#
# The chart sets the environment from its values:
#   SKEP_ENDPOINT, SKEP_ENVIRONMENT, SKEP_COLLECTOR_NAME, SKEP_FLEET,
#   SKEP_TIER; secrets from the existing Secret:
#   SKEP_API_KEY
#
# Pipeline: OTLP in -> memory_limiter -> skepobserver/pre -> tail_sampling -> skepobserver/post -> nop.
# The observers are read only: they never drop, change or delay telemetry.

extensions:
  skepcontrol:
    endpoint: ${env:SKEP_ENDPOINT}
    api_key: ${env:SKEP_API_KEY}
    environment: ${env:SKEP_ENVIRONMENT}
    name: ${env:SKEP_COLLECTOR_NAME:-}
    fleet: ${env:SKEP_FLEET}
    tier: ${env:SKEP_TIER}
    state_dir: /var/lib/skep-otelcol
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Request metadata lets the observer see which tier already counted
        # an item (x-skep-observed).
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  # First in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  skepobserver/pre:
    position: pre_sampling
    control_extension: skepcontrol
  # A starting policy; Skep's Sampling page compiles one tuned to your
  # services. Policies combine as OR: a trace is kept if any matches.
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline-10pct
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  skepobserver/post:
    position: post_sampling
    control_extension: skepcontrol

exporters:
  # No backend yet: telemetry is observed by Skep, then discarded.
  nop: {}

service:
  extensions: [health_check, skepcontrol]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, skepobserver/pre, tail_sampling, skepobserver/post]
      exporters: [nop]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, skepobserver/pre]
      exporters: [nop]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, skepobserver/pre]
      exporters: [nop]
