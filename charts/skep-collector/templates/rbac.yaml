{{- if and (eq .Values.mode "agent") .Values.rbac.create }}
# k8s_attributes reads pod metadata for the node it runs on.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skep-collector.fullname" . }}
  labels:
    {{- include "skep-collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, watch, list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skep-collector.fullname" . }}
  labels:
    {{- include "skep-collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skep-collector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skep-collector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
