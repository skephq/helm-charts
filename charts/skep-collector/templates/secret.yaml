{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skep-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skep-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  SKEP_API_KEY: {{ required "secret.skepApiKey is required when secret.create is true" .Values.secret.skepApiKey | quote }}
  {{- with .Values.secret.honeycombApiKey }}
  HONEYCOMB_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
